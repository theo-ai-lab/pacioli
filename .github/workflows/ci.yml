name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: typecheck · lint · test · fuzz · eval · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The tamper-evidence claim, re-proven every push against a committed reference store: the
      # verifier walks its hash chain and per-scope Merkle roots and exits non-zero on the first
      # mismatch. (Regenerate the fixture only through the store API — a hand-edited sqlite file
      # cannot verify, which is the entire point.)
      - run: npm run verify:ledger -- dataset/reference-ledger.db
      # …and the adversarial half of the same claim: a scripted attacker mutates a COPY of that store
      # 34 ways from a seeded generator (edit, delete, reorder, truncate, forge, re-insert, splice,
      # malformed encodings, rewritten commitments) and the verifier must catch 100% of them. An
      # ESCAPE — any tamper the verifier passes — exits non-zero, so a hole in the tamper-evidence
      # story breaks the build instead of waiting to be noticed.
      - run: npm run drill:tamper
      # The published drill report is regenerated and held to a byte-for-byte diff, like the eval
      # snapshot: a claim in docs/ that no longer reproduces is a claim that has rotted.
      - run: npm run drill:tamper -- --report docs/TAMPER-DRILL.md && git diff --exit-code docs/TAMPER-DRILL.md
      - run: npm run fuzz # 50k mutated cases against the formal invariants
      - run: npm run eval # per-class precision/recall
      - run: npm run eval:snapshot && git diff --exit-code eval/RESULTS.md # frozen eval/RESULTS.md must reproduce byte-for-byte
      - run: npm run build

  install-smoke:
    # Installability is a re-proven gate, like the eval snapshot: pack
    # @pacioli-app/engine exactly as `npm publish` would, install the tarball in
    # a fresh consumer dir, require() it and reconcile, and hold the CLI to its
    # documented --help and exit-code contract.
    name: engine pack → install → require + CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npm run smoke:install

  parity-probe:
    # The deploy-parity workflow's DATA check, proven here against a locally started instance on every
    # push. Same script, same fixture; only BASE differs. That keeps "the deployment reconciles
    # correctly" a check this repo can prove it owns, instead of one that only ever runs against a URL
    # nobody can re-run — and it means a change that breaks the verdict reddens CI, not just parity.
    name: a local instance returns the right verdict (deploy-parity's data check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Start the app and probe it
        run: |
          PACIOLI_DB="$RUNNER_TEMP/parity-receipts.db" PORT=3111 npm start &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null "http://127.0.0.1:3111/api/version" && break
            sleep 1
          done
          BASE=http://127.0.0.1:3111 node scripts/parity-probe.mjs
      - name: The receipt it just wrote is in a verifiable ledger
        run: npm run verify:ledger -- "$RUNNER_TEMP/parity-receipts.db"

  inspect-eval:
    name: Inspect AI eval (citable harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: npm ci --no-audit --no-fund
      - run: pip install inspect-ai
      - run: npm run eval:build # engine -> eval/dataset.jsonl
      - run: inspect eval eval/discrepancy_eval.py --model mockllm/model -T split=all -T seed=1234 --display plain
